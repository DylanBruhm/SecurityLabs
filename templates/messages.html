<!DOCTYPE html>
<html>
<head>
    <title>Email</title>
</head>    
<body>
    {% for message in messages %}

        <p>
            sender {{ message[1] }}
            
            receiver {{ message[2] }}

            subject {{ message[3] }}

            body {{ message[4] }}

            sent_at {{ message[5] }}  

        </p>

    {% endfor %}
</body>
</html>
